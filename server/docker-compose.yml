version: "3"
networks:
  network:
services:
  nginx:
    networks:
      - network
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:r0
      - /home/admin/myPacs/server/nginx.conf:/etc/nginx/nginx.conf:ro
      - /home/admin/myPacs/server/certs:/etc/certs:ro
      - /home/admin/myPacs/client:/usr/share/nginx/html:ro
      - /home/admin/myPacs/logs:/var/log/nginx
    command: [nginx-debug,'-g','daemon off;']
    depends_on:
      - arc
      - keycloak

  ldap:
    networks:
      - network
    image: dcm4che/slapd-dcm4chee:2.6.13-35.1
    logging:
      driver: json-file
      options:
        max-size: "10m"
    ports:
      - "389:389"
    env_file: docker-compose.env
    volumes:
      - /var/local/dcm4chee-arc/ldap:/var/lib/openldap/openldap-data
      - /var/local/dcm4chee-arc/slapd.d:/etc/openldap/slapd.d
  db:
    networks:
      - network
    image: dcm4che/postgres-dcm4chee:17.9-35
    logging:
      driver: json-file
      options:
        max-size: "10m"
    ports:
     - "5432:5432"
    env_file: docker-compose.env
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /var/local/dcm4chee-arc/db:/var/lib/postgresql/data
  arc:
    networks:
      - network
    image: dcm4che/dcm4chee-arc-psql:5.35.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
    ports:
      - "8080:8080"
      - "8443:8443"
      - "9990:9990"
      - "9993:9993"
      - "11112:11112"
      - "2762:2762"
      - "2575:2575"
      - "12575:12575"
    env_file: docker-compose.env
    environment:
      POSTGRES_DB: pacsdb
      POSTGRES_USER: pacs
      POSTGRES_PASSWORD: pacs
      WILDFLY_CHOWN: "/opt/wildfly/standalone /storage"
      WILDFLY_WAIT_FOR: ldap:389 db:5432
      KEYSTORE: /opt/wildfly/standalone/configuration/keystores/key.p12
      KEYSTORE_PASSWORD: secret
      KEYSTORE_TYPE: PKCS12
    depends_on:
      - ldap
      - db
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /var/local/dcm4chee-arc/wildfly:/opt/wildfly/standalone
      - /var/local/dcm4chee-arc/storage:/storage
      - /home/admin/myPacs/server/certs:/opt/wildfly/standalone/configuration/keystores
  keycloak:
    networks:
      - network
    image: quay.io/keycloak/keycloak:26.7.4
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: changeit
      KC_HOSTNAME: webviz.xyz
      KC_HTTP_ENABLED: true
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_PORT: 8880
    ports:
      - "8880:8880"
    volumes:
      - ./keycloak_data:/opt/keycloak/data
    command: start-dev

